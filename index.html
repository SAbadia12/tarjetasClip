<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjetas con clip-path</title>

  <!-- Font Awesome por CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- Tipografía similar a la del ejemplo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>


  <main class="board">

    <!-- Tarjeta 1 -->
    <article class="card card--one">
      <header class="card__header">
        <img class="card__avatar" src="https://i.pravatar.cc/200?img=12" alt="Foto de Jhon Doe">
      </header>

      <div class="card__body">
        <h2 class="card__name">Jhon Doe</h2>
        <hr class="card__divider">
        <p class="card__text">Lorem ipsum dolor sit amet, consectetur adipisicing elit et cupiditate deleniti.</p>

        <ul class="card__actions">
          <li><a class="card__action" href="#" aria-label="Agregar"><i class="fa-solid fa-plus"></i></a></li>
          <li><a class="card__action" href="#" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a></li>
          <li><a class="card__action" href="#" aria-label="Correo"><i class="fa-solid fa-envelope"></i></a></li>
        </ul>
      </div>

      <footer class="card__footer">
        <ul class="card__social">
          <li><a class="card__social-link" href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a></li>
          <li><a class="card__social-link" href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a></li>
          <li><a class="card__social-link" href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a></li>
          <li><a class="card__social-link" href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a></li>
        </ul>
      </footer>
    </article>

    <!-- Tarjeta 2 -->
    <article class="card card--two">
      <header class="card__header">
        <img class="card__avatar" src="https://i.pravatar.cc/200?img=47" alt="Foto de Allison Walker">
      </header>

      <div class="card__body">
        <h2 class="card__name">Allison Walker</h2>
        <hr class="card__divider">
        <p class="card__text">Lorem ipsum dolor sit amet, consectetur adipisicing elit et cupiditate deleniti.</p>

        <ul class="card__actions">
          <li><a class="card__action card__action--outline" href="#" aria-label="Agregar"><i class="fa-solid fa-plus"></i></a></li>
          <li><a class="card__action card__action--outline" href="#" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a></li>
          <li><a class="card__action card__action--outline" href="#" aria-label="Correo"><i class="fa-solid fa-envelope"></i></a></li>
        </ul>
      </div>

      <footer class="card__footer">
        <ul class="card__social">
          <li><a class="card__social-link" href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a></li>
          <li><a class="card__social-link" href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a></li>
          <li><a class="card__social-link" href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a></li>
          <li><a class="card__social-link" href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a></li>
        </ul>
      </footer>
    </article>

  </main>

</body>
</html>
